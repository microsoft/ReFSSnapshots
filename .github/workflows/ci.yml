name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on PowerShell ${{ matrix.psversion }}
    runs-on: windows-latest
    strategy:
      matrix:
        psversion: ['5.1', '7.4']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PowerShell 7
      if: matrix.psversion == '7.4'
      uses: actions/setup-powershell@v1

    - name: Display PowerShell version
      shell: powershell
      run: $PSVersionTable

    - name: Install Pester
      shell: powershell
      run: |
        Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck

    - name: Install PSScriptAnalyzer
      shell: powershell
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck

    - name: Run PSScriptAnalyzer
      shell: powershell
      run: |
        $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSScriptAnalyzerSettings.psd1 -Severity Error
        if ($results) {
          $results | Format-Table -AutoSize
          throw "PSScriptAnalyzer found $($results.Count) error(s)"
        } else {
          Write-Host "PSScriptAnalyzer: No errors found" -ForegroundColor Green
        }

        # Show warnings but don't fail
        $warnings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSScriptAnalyzerSettings.psd1 -Severity Warning
        if ($warnings) {
          Write-Host "`nFound $($warnings.Count) warnings (non-blocking):" -ForegroundColor Yellow
          $warnings | Select-Object -First 10 | Format-Table RuleName, ScriptName, Line
        }

    - name: Test module manifest
      shell: powershell
      run: |
        $manifest = Test-ModuleManifest -Path .\ReFSSnapshots.psd1 -ErrorAction Stop
        Write-Host "Module manifest is valid"
        Write-Host "Version: $($manifest.Version)"
        Write-Host "Exported functions: $($manifest.ExportedFunctions.Count)"

    - name: Run Pester tests
      shell: powershell
      run: |
        $config = New-PesterConfiguration
        $config.Run.Path = '.\Tests'
        $config.Run.Exit = $true
        $config.CodeCoverage.Enabled = $false
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputPath = 'testResults.xml'
        Invoke-Pester -Configuration $config

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-ps${{ matrix.psversion }}
        path: testResults.xml

  analyze:
    name: Security and Quality Analysis
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run PSScriptAnalyzer for Security
      shell: powershell
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck
        $errors = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
        if ($errors) {
          Write-Host "Security/Quality Errors:" -ForegroundColor Red
          $errors | Format-Table -AutoSize
          throw "Found $($errors.Count) error(s)"
        } else {
          Write-Host "No security or quality errors found" -ForegroundColor Green
        }
