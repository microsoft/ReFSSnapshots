name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Module
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Display PowerShell version
      shell: pwsh
      run: $PSVersionTable

    - name: Install dependencies
      shell: pwsh
      run: |
        Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck
        Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck

    - name: Test module manifest
      shell: pwsh
      run: |
        $manifest = Test-ModuleManifest -Path .\ReFSSnapshots.psd1 -ErrorAction Stop
        Write-Host "Module manifest is valid"
        Write-Host "Version: $($manifest.Version)"
        Write-Host "Exported functions: $($manifest.ExportedFunctions.Count)"

    - name: Run PSScriptAnalyzer
      shell: pwsh
      continue-on-error: true
      run: |
        $results = Invoke-ScriptAnalyzer -Path .\Public -Recurse -Severity Error
        if ($results) {
          Write-Host "PSScriptAnalyzer found issues (non-blocking):"
          $results | Format-Table -AutoSize
        } else {
          Write-Host "PSScriptAnalyzer: No errors found"
        }

    - name: Run Pester tests
      shell: pwsh
      run: |
        $config = New-PesterConfiguration
        $config.Run.Path = '.\Tests'
        $config.Run.Exit = $true
        $config.CodeCoverage.Enabled = $false
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputPath = 'testResults.xml'
        $config.Output.Verbosity = 'Detailed'
        Invoke-Pester -Configuration $config

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: testResults.xml
